<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEW SHOP</title><style>
body{font-family:Arial;margin:0;background:#f5f7fb;color:#17233b}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:#082654;color:white;border-radius:18px;padding:28px;margin-bottom:20px}.hero h1{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card,.box{background:white;padding:16px;border-radius:14px;box-shadow:0 2px 10px #ddd}.pic{font-size:55px;text-align:center;background:#f3f5fa;padding:15px;border-radius:10px}.price{font-weight:bold;color:#d33;font-size:18px}.btn{padding:10px 15px;border:0;border-radius:8px;background:#ffbf00;font-weight:bold;cursor:pointer}.cart{position:sticky;bottom:0;background:white;padding:15px;box-shadow:0 -2px 10px #ddd;margin-top:20px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.hidden{display:none}.modal>div{background:#fff;padding:22px;border-radius:14px;width:min(500px,90%)}input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}small{color:#666}
</style></head><body><div class="wrap"><div class="hero"><h1>🛍️ NEW SHOP</h1><p>Sasta. Smart. Sabke Liye.</p><button class="btn" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button></div><h2>Popular Products</h2><div id="products" class="grid"></div><div id="cart" class="cart">Cart empty</div></div><div id="modal" class="modal hidden"><div><h2>Place Order</h2><form id="form"><input id="name" required placeholder="Full name"><input id="phone" required placeholder="Mobile number"><textarea id="address" required placeholder="Full address"></textarea><input id="pin" required placeholder="PIN code"><select id="payment"><option>UPI - Online Payment</option><option>Cash on Delivery</option></select><p>Total: <b id="total">₹0</b></p><button class="btn" type="submit">Place Order</button> <button type="button" onclick="closeModal()">Cancel</button></form></div></div><script>
const products=[
{id:1,n:"Basic 4G Feature Phone",p:949,i:"📱"},{id:2,n:"Jio Bharat Style Phone",p:849,i:"📱"},{id:3,n:"itel Feature Phone",p:1049,i:"📱"},{id:4,n:"Basic Phone",p:1299,i:"📱"},{id:5,n:"Smart Watch D20",p:499,i:"⌚"},{id:6,n:"Bluetooth Neckband",p:399,i:"🎧"},{id:7,n:"Wireless Earbuds",p:499,i:"🎧"},{id:8,n:"Bluetooth Headphone",p:299,i:"🎧"},{id:9,n:"USB Data Cable",p:99,i:"🔌"},{id:10,n:"20W USB Charger",p:299,i:"🔌"}];
let cart=[];const money=n=>"₹"+n.toLocaleString("en-IN");
function render(){productsEl.innerHTML=products.map(x=>`<div class="card"><div class="pic">${x.i}</div><h3>${x.n}</h3><div class="price">${money(x.p)}</div><button class="btn" onclick="add(${x.id})">Add to Cart</button></div>`).join("");update()}
const productsEl=document.getElementById("products");
function add(id){cart.push(products.find(x=>x.id===id));update()}
function update(){document.getElementById("count").textContent=cart.length;document.getElementById("cart").innerHTML=cart.length?`<b>${cart.length} item(s)</b> — ${money(cart.reduce((a,x)=>a+x.p,0))} <button class="btn" onclick="showCart()">Checkout</button>`:"Cart empty"}
function showCart(){if(!cart.length)return alert("Cart is empty");document.getElementById("total").textContent=money(cart.reduce((a,x)=>a+x.p,0));document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const total=cart.reduce((a,x)=>a+x.p,0);const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,phone:phone.value,address:address.value,pincode:pin.value,payment:payment.value,total,items:cart})});const d=await r.json();if(!r.ok)return alert(d.error||"Order failed");alert("Order placed! Order ID: "+d.id);cart=[];update();closeModal();e.target.reset()};
render();
</script></body></html>
